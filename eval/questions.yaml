- id: q028
  category: simple
  question: >-
    What is the fastest average pace of any run of 10 km or longer, in minutes per km
    as a decimal number (for example 4.5 for 4:30 per km)?
  answerable: true
  gold_sql: |
    SELECT min(avg_pace_s_per_km) / 60 AS pace_min_per_km
    FROM activities
    WHERE sport_group = 'running'
      AND distance_km >= 10
  ordered: false
  verified: true
  notes: >-
    Fastest pace is the lowest value. Covers the whole history. The column is in
    seconds per km, so the query has to divide by 60.

- id: q029
  category: simple
  question: >-
    What was my overall running pace in 2025, calculated as total timer time divided by
    total distance? Count only runs with a recorded distance. Answer in minutes per km
    as a decimal number (for example 4.5 for 4:30 per km).
  answerable: true
  gold_sql: |
    SELECT sum(timer_time_s) / sum(distance_km) / 60 AS pace_min_per_km
    FROM activities
    WHERE sport_group = 'running'
      AND distance_km IS NOT NULL
      AND start_time_local >= TIMESTAMP '2025-01-01'
      AND start_time_local < TIMESTAMP '2026-01-01'
  ordered: false
  verified: true
  notes: >-
    Not the same as avg(avg_pace_s_per_km), which weights a short run as much as a
    long one. The question names the method so that only one answer is correct.

- id: q030
  category: simple
  question: What was my total elevation gain in metres across all activities in 2025?
  answerable: true
  gold_sql: |
    SELECT sum(total_ascent_m)
    FROM activities
    WHERE start_time_local >= TIMESTAMP '2025-01-01'
      AND start_time_local < TIMESTAMP '2026-01-01'
  ordered: false
