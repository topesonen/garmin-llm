# Eval questions about the real data. This file is public: it holds questions and gold SQL only.
# Do not add label values, race names, places or any result of a query on the real data.
# Only Topias sets verified to true, after checking the gold SQL on the real database.

- id: q001
  category: simple
  question: How many runs did I do in 2025?
  answerable: true
  gold_sql: |
    SELECT count(*)
    FROM activities
    WHERE sport_group = 'running'
      AND start_time_local >= TIMESTAMP '2025-01-01'
      AND start_time_local < TIMESTAMP '2026-01-01'
  ordered: false
  verified: true
  notes: ""

