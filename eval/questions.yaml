- id: q031
  category: simple
  question: >-
    What is the highest elevation gain per km of any run of 5 km or longer,
    in metres of gain per km?
  answerable: true
  gold_sql: |
    SELECT max(total_ascent_m / distance_km) AS gain_m_per_km
    FROM activities
    WHERE sport_group = 'running'
      AND distance_km >= 5
  ordered: false
  verified: true
  notes: The 5 km minimum keeps very short activities from producing extreme ratios.

- id: q032
  category: date_logic
  question: >-
    In which month of 2025 did I gain the most elevation while running?
    Answer with the month number (1 to 12).
  answerable: true
  gold_sql: |
    SELECT month(start_time_local) AS month
    FROM activities
    WHERE sport_group = 'running'
      AND start_time_local >= TIMESTAMP '2025-01-01'
      AND start_time_local < TIMESTAMP '2026-01-01'
    GROUP BY month(start_time_local)
    ORDER BY sum(total_ascent_m) DESC NULLS LAST
    LIMIT 1
  ordered: false
  verified: true
  notes: Check there is no tie for the top month.

- id: q033
  category: multi_step
  question: >-
    Estimate my best time over 1 km, 5 km, 10 km, the half marathon (21.0975 km) and
    the marathon (42.195 km). For each distance, take the fastest average pace (timer
    time divided by distance) of any run at least that long, and multiply it by the
    distance. Return the distance in km and the estimated time in minutes as a decimal
    number, ordered by distance. Leave out a distance if no run is long enough.
  answerable: true
  gold_sql: |
    SELECT d.km AS distance_km,
           min(a.timer_time_s / a.distance_km) * d.km / 60 AS best_time_min
    FROM (VALUES (1.0), (5.0), (10.0), (21.0975), (42.195)) AS d(km)
    JOIN activities AS a
      ON a.sport_group = 'running'
     AND a.distance_km >= d.km
    GROUP BY d.km
    ORDER BY d.km
  ordered: true
  verified: true
  notes: >-
    This is an estimate from whole activities, not Garmin's best-effort records: the
    table has nothing from inside an activity, so the fastest 5 km stretch within a
    longer run cannot be found. The true best effort is equal to or faster than this
    estimate. All five rows must match for the answer to count as correct.

- id: q034
  category: date_logic
  question: >-
    Which week of 2025 had my highest total running distance, and what was that distance
    in km? Weeks run Monday to Sunday. Count only weeks whose Monday falls in 2025.
    Return the date of that Monday and the total distance.
  answerable: true
  gold_sql: |
    SELECT CAST(date_trunc('week', start_time_local) AS DATE) AS week_start,
           sum(distance_km) AS total_km
    FROM activities
    WHERE sport_group = 'running'
      AND date_trunc('week', start_time_local) >= TIMESTAMP '2025-01-01'
      AND date_trunc('week', start_time_local) < TIMESTAMP '2026-01-01'
    GROUP BY date_trunc('week', start_time_local)
    ORDER BY sum(distance_km) DESC
    LIMIT 1
  ordered: false
  verified: true
  notes: >-
    Same week as q007, with the distance added. q007 expects one column and this
    question two, so a model can pass one and fail the other.
