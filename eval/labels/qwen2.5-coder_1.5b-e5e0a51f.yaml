- id: q033
  verdict: wrong_result
  detail: "row count differs: gold 5, model 0"
  question: >-
    Estimate my best time over 1 km, 5 km, 10 km, the half marathon (21.0975 km) and the marathon (42.195 km). For each distance, take the fastest average pace (timer time divided by distance) of any run at least that long, and multiply it by the distance. Return the distance in km and the estimated time in minutes as a decimal number, ordered by distance. Leave out a distance if no run is long enough.
  gold_sql: |
    SELECT d.km AS distance_km,
           min(a.timer_time_s / a.distance_km) * d.km / 60 AS best_time_min
    FROM (VALUES (1.0), (5.0), (10.0), (21.0975), (42.195)) AS d(km)
    JOIN activities AS a
      ON a.sport_group = 'running'
     AND a.distance_km >= d.km
    GROUP BY d.km
    ORDER BY d.km
  model_sql: |
    SELECT 
        distance_km,
        AVG(timer_time_s / distance_km) * 60 AS estimated_time_minutes
    FROM 
        activities
    WHERE 
        sport_group = 'running'
        AND avg_pace_s_per_km IS NOT NULL
    GROUP BY 
        distance_km
    HAVING 
        AVG(timer_time_s / distance_km) < 100
    ORDER BY 
        distance_km;
  category: other
  note: "Missing steps: never builds the five target distances or the 'at least that long' rule; groups by each exact distance instead. Uses avg where the fastest pace (min) is needed, multiplies by 60 where it should divide, and an arbitrary HAVING < 100 removes every row."
