- id: q008
  verdict: rejected
  detail: "must read only the activities table, found: none"
  question: >-
    How many more km did I run from January to June 2026 than from January to June 2025? A negative number means I ran less in 2026.
  gold_sql: |
    SELECT
      sum(CASE WHEN start_time_local >= TIMESTAMP '2026-01-01'
                AND start_time_local < TIMESTAMP '2026-07-01' THEN distance_km END)
      - sum(CASE WHEN start_time_local >= TIMESTAMP '2025-01-01'
                  AND start_time_local < TIMESTAMP '2025-07-01' THEN distance_km END)
      AS km_difference
    FROM activities
    WHERE sport_group = 'running'
  model_sql: |
    SELECT (sum(distance_km) FILTER (WHERE start_time_local >= TIMESTAMP '2026-01-01' AND start_time_local < TIMESTAMP '2026-07-01')) -
           (sum(distance_km) FILTER (WHERE start_time_local >= TIMESTAMP '2025-01-01' AND start_time_local < TIMESTAMP '2025-07-01')) AS km_difference
  category: wrong_column_or_table
  note: "No FROM clause and no running filter; the two date ranges and the subtraction are right. Second attempt: the retry returned the same query, the guardrail message did not say that FROM was missing."

- id: q012
  verdict: wrong_result
  detail: "values differ"
  question: >-
    For each month of 2025 in which I ran, what was my cumulative running distance in km from the start of 2025 to the end of that month? Return the month number (1 to 12) and the cumulative total, ordered by month.
  gold_sql: |
    SELECT month(start_time_local) AS month,
           sum(sum(distance_km)) OVER (ORDER BY month(start_time_local)) AS cumulative_km
    FROM activities
    WHERE sport_group = 'running'
      AND start_time_local >= TIMESTAMP '2025-01-01'
      AND start_time_local < TIMESTAMP '2026-01-01'
    GROUP BY month(start_time_local)
    ORDER BY month(start_time_local)
  model_sql: |
    SELECT month(start_time_local) AS month, sum(distance_km) AS cumulative_distance_km
    FROM activities
    WHERE sport_group = 'running'
      AND start_time_local >= TIMESTAMP '2025-01-01'
      AND start_time_local < TIMESTAMP '2026-01-01'
    GROUP BY month(start_time_local)
    ORDER BY month(start_time_local)
  category: missing_step
  note: "Computes the sum for each month and names it cumulative, but never accumulates it."

- id: q013
  verdict: wrong_result
  detail: "row count differs: gold 3, model 1"
  question: >-
    For each calendar year, on what date did I do my longest run by distance? Return the year and the date, ordered by year.
  gold_sql: |
    SELECT year(start_time_local) AS year, CAST(start_time_local AS DATE) AS run_date
    FROM activities
    WHERE sport_group = 'running'
    QUALIFY row_number() OVER (
      PARTITION BY year(start_time_local) ORDER BY distance_km DESC NULLS LAST
    ) = 1
    ORDER BY year
  model_sql: |
    SELECT date_trunc('year', start_time_local) AS year, start_time_local AS longest_run_date
    FROM activities
    WHERE sport_group = 'running'
      AND distance_km IS NOT NULL
    ORDER BY year, distance_km DESC
    LIMIT 1
  category: missing_step
  note: "Returns a single row, the longest run of the whole period, in place of the longest per year. Year and date are also returned as timestamps."

- id: q014
  verdict: rejected
  detail: "does not parse: Parser Error: syntax error at or near \"WINDOW\""
  question: >-
    What is the highest total running distance in km that I have covered in any period of 7 consecutive calendar days?
  gold_sql: |
    SELECT max(km_7d)
    FROM (
      SELECT sum(distance_km) OVER (
               ORDER BY CAST(start_time_local AS DATE)
               RANGE BETWEEN INTERVAL 6 DAY PRECEDING AND CURRENT ROW
             ) AS km_7d
      FROM activities
      WHERE sport_group = 'running'
    )
  model_sql: |
    SELECT max(total_distance)
    FROM (
      SELECT sum(distance_km) AS total_distance
      FROM activities
      WHERE sport_group = 'running'
      GROUP BY date_trunc('day', start_time_local)
      ORDER BY date_trunc('day', start_time_local)
      WINDOW w AS (ORDER BY date_trunc('day', start_time_local) ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)
    )
  category: missing_step
  note: "Daily sums only. A WINDOW clause is written after ORDER BY, where it does not parse, and nothing uses it. Its frame counts 6 rows back, which is days with a run, not calendar days. Second attempt: the retry returned the same query."

- id: q015
  verdict: wrong_result
  detail: "values differ"
  question: >-
    What is my longest streak of consecutive calendar days with at least one run? Answer with the number of days.
  gold_sql: |
    WITH run_days AS (
      SELECT DISTINCT CAST(start_time_local AS DATE) AS d
      FROM activities
      WHERE sport_group = 'running'
    ),
    grouped AS (
      SELECT d, d - CAST(row_number() OVER (ORDER BY d) AS INTEGER) AS streak_key
      FROM run_days
    )
    SELECT max(streak_days)
    FROM (SELECT count(*) AS streak_days FROM grouped GROUP BY streak_key)
  model_sql: |
    SELECT max(streak) AS longest_streak
    FROM (
      SELECT sum(CASE WHEN sport_group = 'running' THEN 1 ELSE 0 END) AS streak
      FROM (
        SELECT sport_group,
               start_time_local,
               lag(sport_group) OVER (ORDER BY start_time_local) AS prev_sport_group,
               lag(start_time_local) OVER (ORDER BY start_time_local) AS prev_start_time_local
        FROM activities
      )
      WHERE sport_group = 'running'
        OR (prev_sport_group = 'running' AND start_time_local - prev_start_time_local <= INTERVAL '1 day')
      GROUP BY start_time_local
    )
  category: missing_step
  note: "Uses LAG to look at the previous activity, but never groups consecutive days into streaks; it groups by exact start time."

- id: q017
  verdict: wrong_result
  detail: "values differ"
  question: >-
    In how many calendar months did I run more km in 2025 than in the same month of 2024? Count only months in which I ran in both years.
  gold_sql: |
    WITH monthly AS (
      SELECT year(start_time_local) AS year, month(start_time_local) AS month,
             sum(distance_km) AS km
      FROM activities
      WHERE sport_group = 'running'
        AND start_time_local >= TIMESTAMP '2024-01-01'
        AND start_time_local < TIMESTAMP '2026-01-01'
      GROUP BY year(start_time_local), month(start_time_local)
    )
    SELECT count(*)
    FROM monthly AS y2025
    JOIN monthly AS y2024 ON y2025.month = y2024.month
    WHERE y2025.year = 2025
      AND y2024.year = 2024
      AND y2025.km > y2024.km
  model_sql: |
    SELECT count(*)
    FROM (
      SELECT month(start_time_local) AS month
      FROM activities
      WHERE sport_group = 'running'
        AND start_time_local >= TIMESTAMP '2024-01-01'
        AND start_time_local < TIMESTAMP '2025-01-01'
      GROUP BY month(start_time_local)
    ) AS subquery
    WHERE subquery.month IN (
      SELECT month(start_time_local)
      FROM activities
      WHERE sport_group = 'running'
        AND month(start_time_local) = subquery.month
        AND start_time_local >= TIMESTAMP '2023-01-01'
        AND start_time_local < TIMESTAMP '2024-01-01'
      GROUP BY month(start_time_local)
      HAVING sum(distance_km) < (
        SELECT sum(distance_km)
        FROM activities
        WHERE sport_group = 'running'
          AND month(start_time_local) = subquery.month
          AND start_time_local >= TIMESTAMP '2024-01-01'
          AND start_time_local < TIMESTAMP '2025-01-01'
      )
    )
  category: wrong_date_logic
  note: "Second attempt, after a binder error. Compares 2024 with 2023 where 2025 and 2024 were asked. The per-month comparison itself is in place."

- id: q019
