  question: >-
    What is the highest total running distance in km that I have covered in any period of 7 consecutive calendar days?
  gold_sql: |
    SELECT max(km_7d)
    FROM (
      SELECT sum(distance_km) OVER (
               ORDER BY CAST(start_time_local AS DATE)
               RANGE BETWEEN INTERVAL 6 DAY PRECEDING AND CURRENT ROW
             ) AS km_7d
      FROM activities
      WHERE sport_group = 'running'
    )
  model_sql: |
    -- 1. Keep running activities.
    -- 2. Sum distances for each 7-day period.
    -- 3. Take the highest sum.
    SELECT max(total_distance)
    FROM (
      SELECT sum(distance_km) AS total_distance
      FROM (
        SELECT distance_km,
               date_trunc('day', start_time_local) AS day
        FROM activities
        WHERE sport_group = 'running'
      ) AS daily_distances
      GROUP BY day, date_trunc('week', day)
      HAVING date_trunc('week', day) = date_trunc('week', day)
    )
  category: missing_step
  note: "Plan: vague. 'Sum distances for each 7-day period' does not say that the period moves day by day. The query groups by day, with a HAVING condition that is always true, so it returns the largest daily total."

- id: q015
  verdict: sql_error
  detail: "Binder Error"
  question: >-
    What is my longest streak of consecutive calendar days with at least one run? Answer with the number of days.
  gold_sql: |
    WITH run_days AS (
      SELECT DISTINCT CAST(start_time_local AS DATE) AS d
      FROM activities
      WHERE sport_group = 'running'
    ),
    grouped AS (
      SELECT d, d - CAST(row_number() OVER (ORDER BY d) AS INTEGER) AS streak_key
      FROM run_days
    )
    SELECT max(streak_days)
    FROM (SELECT count(*) AS streak_days FROM grouped GROUP BY streak_key)
  model_sql: |
    WITH run_dates AS (
      SELECT date_trunc('day', start_time_local) AS run_date
      FROM activities
      WHERE sport_group = 'running'
    ),
    consecutive_days AS (
      SELECT run_date,
             run_date - INTERVAL '1 day' * row_number() OVER (ORDER BY run_date) AS grp
      FROM run_dates
    )
    SELECT grp, max(run_date - min(run_date) + 1) AS longest_streak
    FROM consecutive_days
    GROUP BY grp
  category: other
  note: "Plan: vague (first attempt; the retry reply has no plan). 'Identify consecutive days' does not say how. Second attempt, after a binder error: groups days into streaks with row_number, which no earlier labelled 7b run did, but takes dates without DISTINCT, so two runs on one day break a streak, and nests min inside max, which is the binder error. Also returns the streak key."

