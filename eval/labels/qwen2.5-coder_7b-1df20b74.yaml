- id: q007
  verdict: wrong_result
  detail: "column count differs: gold 1, model 2"
  question: >-
    Which week of 2025 had my highest total running distance? Weeks run Monday to Sunday. Count only weeks whose Monday falls in 2025, and answer with the date of that Monday.
  gold_sql: |
    SELECT CAST(date_trunc('week', start_time_local) AS DATE) AS week_start
    FROM activities
    WHERE sport_group = 'running'
      AND date_trunc('week', start_time_local) >= TIMESTAMP '2025-01-01'
      AND date_trunc('week', start_time_local) < TIMESTAMP '2026-01-01'
    GROUP BY date_trunc('week', start_time_local)
    ORDER BY sum(distance_km) DESC
    LIMIT 1
  model_sql: |
    -- 1. Keep running activities that started in 2025.
    -- 2. Sum distances per week, starting from Monday.
    -- 3. Find the week with the highest total distance.
    SELECT date_trunc('week', start_time_local) AS week_start, sum(distance_km) AS total_distance
    FROM activities
    WHERE sport_group = 'running'
      AND start_time_local >= TIMESTAMP '2025-01-01'
      AND start_time_local < TIMESTAMP '2026-01-01'
    GROUP BY date_trunc('week', start_time_local)
    ORDER BY total_distance DESC
    LIMIT 1
  category: other
  note: "Plan: right. Returns the weekly total next to the date; with that column dropped the answer matches the gold query (checked on the snapshot). Also keeps runs that started in 2025 where the question asks for weeks whose Monday is in 2025, in the plan and the query; that does not change the answer on this data. Correct without the plan in run 6."

