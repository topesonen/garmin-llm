- id: q019
  verdict: wrong_result
  detail: "values differ"
  question: >-
    On how many calendar days have I recorded both a run and a strength training session?
  gold_sql: |
    SELECT count(*)
    FROM (
      SELECT CAST(start_time_local AS DATE) AS day
      FROM activities
      WHERE sport_group IN ('running', 'strength')
      GROUP BY CAST(start_time_local AS DATE)
      HAVING count(DISTINCT sport_group) = 2
    )
  model_sql: |
    -- 1. Find all unique days with runs.
    -- 2. Find all unique days with strength training sessions.
    -- 3. Find the intersection of these days.
    -- 4. Count the number of days in the intersection.
    SELECT count(DISTINCT run_day) + count(DISTINCT strength_day) - count(DISTINCT both_day) AS days_with_both
    FROM (
      SELECT date_trunc('day', start_time_local) AS run_day, NULL AS strength_day, NULL AS both_day
      FROM activities
      WHERE sport_group = 'running'
      UNION
      SELECT NULL, date_trunc('day', start_time_local) AS strength_day, NULL AS both_day
      FROM activities
      WHERE sport_group = 'strength'
      UNION
      SELECT date_trunc('day', start_time_local) AS both_day, NULL, NULL
      FROM activities
      WHERE sport_group = 'running'
        AND date_trunc('day', start_time_local) IN (
          SELECT date_trunc('day', start_time_local)
          FROM activities
          WHERE sport_group = 'strength'
        )
    )
  category: other
  note: "Plan: right. Steps 1 to 4 describe the intersection of run days and strength days. The query adds the two counts and subtracts a third from a UNION whose third branch puts its days in the first column, so it does not compute the intersection."

