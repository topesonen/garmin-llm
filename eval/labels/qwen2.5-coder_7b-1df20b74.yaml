    -- 1. Keep running activities that started in 2025 and 2026.
    -- 2. Sum the distances for each year.
    -- 3. Subtract the 2025 sum from the 2026 sum.
    SELECT sum(CASE WHEN year(start_time_local) = 2026 THEN distance_km ELSE 0 END) -
           sum(CASE WHEN year(start_time_local) = 2025 THEN distance_km ELSE 0 END) AS km_difference
