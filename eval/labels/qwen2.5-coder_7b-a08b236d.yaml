      SELECT sum(distance_km) AS week_km
      FROM activities
      WHERE sport_group = 'running'
        AND date_trunc('week', start_time_local) >= TIMESTAMP '2025-01-01'
        AND date_trunc('week', start_time_local) < TIMESTAMP '2026-01-01'
      GROUP BY date_trunc('week', start_time_local)
    )
  model_sql: |
    SELECT SUM(distance_km) / 7 AS avg_weekly_distance_km FROM activities WHERE sport_group = 'running' AND date_trunc('week', start_time_local) BETWEEN '2025-01-01' AND '2025-12-31' GROUP BY date_trunc('week', start_time_local) HAVING COUNT(activity_id) > 0
  category: missing_step
  note: "Weekly sums are right, but it returns one row per week and divides each by 7. The average over the weeks is missing."

